<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Rodolfo Peixoto">
    <meta name="keywords" content="cursos, ruby, flask, python, golang, sinatra, java, springboot" >
    <meta name="description" content="Curso de desenvolvimento de software ensinando redes e integrando os sistemas" >
    <title>Course HTML skill.dev</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link href="styles.css" rel="stylesheet" >
  </head>
  
  <body class="bg-gray-100 text-gray-800">
    <div id="all-content" class="flex">
      <div id="menu" class="sidebar">
        <h2>Menu</h2>
        <button class="tablink active-tab w-full mb-2" onclick="openTab(event, 'users')"><i class="fas fa-user"></i> Users</button>
        <button class="tablink w-full mb-2" onclick="openTab(event, 'courses')"><i class="fas fa-book"></i> Courses</button>
        <button class="tablink w-full mb-2" onclick="openTab(event, 'lessons')"><i class="fas fa-chalkboard-teacher"></i> Lessons</button>
        <button class="tablink w-full mb-2" onclick="openTab(event, 'attendances')"><i class="fas fa-calendar-check"></i> Attendances</button>
        <button class="tablink w-full mb-2" onclick="openTab(event, 'scores')"><i class="fas fa-star"></i> Scores</button>
      </div>
      
      <main class="content">
        <h1 class="text-3xl font-bold mb-4">Course Management System</h1>
        <div id="edit-success" class="success invisible"></div>
        <div id="edit-error" class="error invisible"></div>

        <section id="users" class="tabcontent">
          <h2 class="text-gray-800">Users</h2>
          <button class="btn mb-4" onclick="showFormById('user-form')">Add New User</button>
          <form id="user-form" class="hidden">
            <label for="user-name">Name</label>
            <input type="text" id="user-name" placeholder="Typing name" class="input-field" />
            <label for="user-email">E-mail</label>
            <input type="email" name="user" id="user-email" value="" placeholder="Typing E-mail" class="input-field" />
            <button type="submit" class="btn">Add User</button>
          </form>

          <div id="user-errors" class="error mt-2"></div>
          <div id="user-success" class="success mt-2"></div>
          <table id="user-list" class="min-w-full bg-white border"></table>
        </section>

        <section id="courses" class="tabcontent hidden">
          <h2 class="text-gray-800">Courses</h2>
         
          <button class="btn mb-4" onclick="showFormById('course-form')">Add New Course</button>

          <form id="course-form" class="hidden">
            <label for="course-title">Title</label>
            <input type="text" id="course-title" placeholder="Typing Title" class="input-field" />
            <label for="course-description">Description</label>
            <textarea id="course-description" class="input-field"></textarea>
            <button type="submit" class="btn">Add Course</button>
          </form>
         
          <div id="course-errors" class="error mt-2"></div>
          <div id="course-success" class="success mt-2"></div>
          <table id="course-list" class="min-w-full bg-white border"></table>
        </section>

        <section id="lessons" class="tabcontent hidden">
          <h2 class="text-gray-800">lessons</h2>
          <button class="btn mb-4" onclick="showFormById('lesson-form')">Add New Lesson</button>

          <form id="lesson-form" class="hidden">
           <label for="lesson-title">Title</label>
           <input type="text" id="lesson-title" placeholder="Title" class="input-field" />
           <label for="lesson-description"></label>
           <textarea id="lesson-description" placeholder="Description" class="input-field"></textarea>
           <label for="lesson-course-id">Course</label>
           <select id="lesson-course-id" class="input-field"></select>
           <button type="submit">Add Lesson</button>
          </form>

          <div id="lesson-errors" class="error mt-2"></div>
          <div id="lesson-success" class="success mt-2"></div>
          <table id="lesson-list" class="min-w-full bg-white border"></table>
        </section>

        <section id="attendances" class="tabcontent hidden">
          <h2 class="text-gray-800">Attendances</h2>
          <button class="btn mb-4" onclick="showFormById('attendance-form')">Add New Attendances</button>

          <form id="attendance-form" class="hidden">
            <label for="attendance-course-id">Course</label>
            <select id="attendance-course-id" class="input-field"></select>
            <label for="attendance-user-id">User</label>
            <select id="attendance-user-id" class="input-field"></select>
           <button type="submit">Add Attendance</button>
          </form>

          <div id="attendance" class="error mt-2"></div>
          <div id="attendance-success" class="success mt-2"></div>
          <table id="attendance-list" class="min-w-full bg-white border"></table>
        </section>

        <section id="scores" class="tabcontent hidden">
          <h1 class="text-gray-800">Scores</h1>
          <button class="btn mb-4" onclick="showFormById('score-form')">Add New Score</button>

          <form id="score-form" class="hidden">
            <label for="score-user-id">User</label>
            <select id="score-user-id" class="input-field"></select>
            <label for="score-video">Video</label>
            <input type="text" id="score-video" placeholder="Video" class="input-field" />
            <label for="score-points">Points</label>
            <input type="number" id="score-points" placeholder="Points" class="input-field" />
           <button type="submit">Add Score</button>
          </form>

          <div id="score" class="error mt-2"></div>
          <div id="score-success" class="success mt-2"></div>
          <table id="score-list" class="min-w-full bg-white border"></table>
        </section>


        <div id="deleteModal" class="fixed z-10 inset-0 overflow-y-auto hidden">
          <div class="flex items-center justify-center min-h-screen px-4 text-center">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
              <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                <div class="sm:flex sm:items-start">
                  <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                    
                    <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Delete Item</h3>
                    <div class="mt-2">
                      <form id="delete-form">
                        <button id="confirmDelete" type="submit" class="btn">Delete</button>
                        <button type="button" class="btn" onclick="closeModal('editModal')">Cancel</button>
                      </form>
                    </div>
  
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        

       
      <div id="editModal" class="fixed z-10 inset-0 overflow-y-auto hidden">
        <div class="flex items-center justify-center min-h-screen px-4 text-center">
          <div class="fixed inset-0 transition-opacity" aria-hidden="true">
            <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
              <div class="sm:flex sm:items-start">
                <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left">
                  
                  <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">Edit Item</h3>
                  <div class="mt-2">
                    <form id="edit-form">
                      <button type="submit" class="btn">Update</button>
                      <button type="button" class="btn" onclick="closeModal('editModal')">Cancel</button>
                    </form>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      </main>
    </div>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/javascript/menu.js"></script>
    <script src="assets/javascript/form.js"></script>

    <script>
      // fetch data on page load
      fetchData('/users', 'user-list');
      fetchData('/courses', 'course-list');
      fetchData('/lessons', 'lesson-list', 'attendance-lesson-id');
      fetchData('/attendances', 'attendance-list', ["attendance-course-id", "attendance-user-id"]);
      fetchData('/scores', 'score-list');
    </script>
  </body>
</html>
